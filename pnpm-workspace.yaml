packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': false
  '@scarf/scarf': true
  bufferutil: true
  core-js-pure: true
  esbuild: true
  keytar: true
  prisma: false
  puppeteer: true
  sharp: true
  workerd: true
overrides:
  # drizzle-orm takes this as an optional peer; one version keeps a single drizzle-orm instance across the workspace.
  '@upstash/redis': 1.39.0
